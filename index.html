<!DOCTYPE html>
<html>
<head>
<title>Code Logic Explainer</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
padding:40px;
}

textarea{
width:80%;
height:200px;
padding:10px;
font-size:15px;
}

button{
padding:10px 20px;
font-size:16px;
background:green;
color:white;
border:none;
cursor:pointer;
margin-top:10px;
}

#result{
margin-top:20px;
background:white;
padding:20px;
width:80%;
margin:auto;
border-radius:8px;
text-align:left;
}
</style>

</head>

<body>

<h2>Code Logic Explainer</h2>

<textarea id="codeInput" placeholder="Paste your code here"></textarea>
<br>

<button onclick="explainCode()">Explain Code</button>

<div id="result"></div>

<script>

function explainCode(){

let code=document.getElementById("codeInput").value;
let explanation="";

if(code.includes("for") && code.includes("range")){

explanation += "<b>Logic:</b><br>";
explanation += "This program uses a FOR LOOP to repeat a block of code multiple times.<br>";
explanation += "The loop starts from a starting value and increases step by step until the ending value.<br>";
explanation += "Inside the loop, the program prints or performs an action for each iteration.<br><br>";

}

if(code.includes("print") || code.includes("console.log")){

explanation += "<b>Output:</b><br>";
explanation += "The program displays the value during each iteration of the loop.<br><br>";

}

if(code.includes("if")){

explanation += "<b>Condition Logic:</b><br>";
explanation += "The program checks a condition. If the condition is true, a specific block of code runs.<br><br>";

}

if(explanation==""){
explanation="The program contains basic statements. It may include variables and operations.";
}

document.getElementById("result").innerHTML=explanation;

}

</script>

</body>
</html>
